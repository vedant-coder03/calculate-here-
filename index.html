<!DOCTYPE html>
<html>
<head>
    <title>Web Calculator</title>
    <style>
        body { font-family: sans-serif; background: #121212; display: flex; justify-content: center; align-items: center; height: 100vh; margin: 0; }
        .calc { background: #1e1e1e; padding: 25px; border-radius: 20px; box-shadow: 0 15px 35px rgba(0,0,0,0.5); width: 300px; }
        #screen { width: 100%; height: 60px; font-size: 32px; margin-bottom: 20px; text-align: right; background: #2d2d2d; color: #00ff88; border: none; padding: 10px; box-sizing: border-box; border-radius: 10px; }
        .grid { display: grid; grid-template-columns: repeat(4, 1fr); gap: 12px; }
        button { padding: 20px; font-size: 20px; cursor: pointer; border: none; border-radius: 12px; background: #333; color: white; transition: 0.2s; }
        button:hover { background: #444; transform: translateY(-2px); }
        .orange { background: #ff9500; }
        .orange:hover { background: #ffaa33; }
    </style>
</head>
<body>
    <div class="calc">
        <input type="text" id="screen" readonly>
        <div class="grid">
            <button onclick="clr()">C</button>
            <button onclick="press('/')" class="orange">/</button>
            <button onclick="press('*')" class="orange">×</button>
            <button onclick="back()">←</button>
            
            <button onclick="press('7')">7</button>
            <button onclick="press('8')">8</button>
            <button onclick="press('9')">9</button>
            <button onclick="press('-')" class="orange">-</button>
            
            <button onclick="press('4')">4</button>
            <button onclick="press('5')">5</button>
            <button onclick="press('6')">6</button>
            <button onclick="press('+')" class="orange">+</button>
            
            <button onclick="press('1')">1</button>
            <button onclick="press('2')">2</button>
            <button onclick="press('3')">3</button>
            <button onclick="solve()" class="orange" style="grid-row: span 2;">=</button>
            
            <button onclick="press('0')" style="grid-column: span 2;">0</button>
            <button onclick="press('.')">.</button>
        </div>
    </div>

    <script>
        let screen = document.getElementById('screen');
        function press(v) { screen.value += v; }
        function clr() { screen.value = ''; }
        function back() { screen.value = screen.value.slice(0, -1); }
        function solve() {
            try {
                // This replaces the Python eval() with JS eval()
                screen.value = eval(screen.value);
            } catch {
                screen.value = "Error";
            }
        }
    </script>
</body>
</html>
