<!DOCTYPE html>
<html>
<head>
    <title>Web Calculator</title>
    <style>
        body { font-family: sans-serif; background: #121212; display: flex; justify-content: center; align-items: center; height: 100vh; margin: 0; }
        .calc { background: #1e1e1e; padding: 25px; border-radius: 20px; box-shadow: 0 15px 35px rgba(0,0,0,0.5); width: 300px; }
        #screen { width: 100%; height: 60px; font-size: 32px; margin-bottom: 20px; text-align: right; background: #2d2d2d; color: #00ff88; border: none; padding: 10px; box-sizing: border-box; border-radius: 10px; }
        .grid { display: grid; grid-template-columns: repeat(4, 1fr); gap: 12px; }
        button { padding: 20px; font-size: 20px; cursor: pointer; border: none; border-radius: 12px; background: #333; color: white; transition: 0.2s; }
        button:hover { background: #444; transform: translateY(-2px); }
        .orange { background: #ff9500; }
        .orange:hover { background: #ffaa33; }

        /* Added History Styling */
        .history-section {
            margin-top: 20px;
            color: #888;
            font-size: 14px;
            max-height: 100px;
            overflow-y: auto;
            border-top: 1px solid #333;
            padding-top: 10px;
        }
        .history-item {
            cursor: pointer;
            padding: 5px 0;
            border-bottom: 1px solid #222;
        }
        .history-item:hover { color: #00ff88; }
    </style>
</head>
<body>
    <div class="calc">
        <input type="text" id="screen" readonly>
        <div class="grid">
            <button onclick="clr()">C</button>
            <button onclick="press('/')" class="orange">/</button>
            <button onclick="press('*')" class="orange">×</button>
            <button onclick="back()">←</button>
            
            <button onclick="press('7')">7</button>
            <button onclick="press('8')">8</button>
            <button onclick="press('9')">9</button>
            <button onclick="press('-')" class="orange">-</button>
            
            <button onclick="press('4')">4</button>
            <button onclick="press('5')">5</button>
            <button onclick="press('6')">6</button>
            <button onclick="press('+')" class="orange">+</button>
            
            <button onclick="press('1')">1</button>
            <button onclick="press('2')">2</button>
            <button onclick="press('3')">3</button>
            <button onclick="solve()" class="orange" style="grid-row: span 2;">=</button>
            
            <button onclick="press('0')" style="grid-column: span 2;">0</button>
            <button onclick="press('.')">.</button>
        </div>

        <div class="history-section">
            <strong>History (Click to reuse)</strong>
            <div id="history-list"></div>
        </div>
    </div>

    <script>
        let screen = document.getElementById('screen');
        let historyList = document.getElementById('history-list');

        function press(v) { screen.value += v; }
        function clr() { screen.value = ''; }
        function back() { screen.value = screen.value.slice(0, -1); }

        function solve() {
            try {
                let expression = screen.value;
                let result = eval(screen.value);
                
                // Add to History
                addHistory(expression + " = " + result);
                
                screen.value = result;
            } catch {
                screen.value = "Error";
            }
        }

        function addHistory(text) {
            let div = document.createElement("div");
            div.className = "history-item";
            div.innerText = text;
            
            // If user clicks history, it puts the result back on screen
            div.onclick = function() {
                screen.value = text.split('=')[1].trim();
            };

            historyList.prepend(div); // Newest on top
        }
    </script>
</body>
</html>
